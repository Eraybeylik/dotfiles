# ~/.tmux.conf  —  Arch + Kali ortak
# TPM yok, bağımlılık yok. Renkler Catppuccin Mocha (hyprland border renklerinle aynı).

##############
### GENEL ###
##############

# Prefix: Ctrl+b -> Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Renk / terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,xterm-256color:Tc,*256col*:Tc"
set -ga terminal-features ",xterm-kitty:usstyle"

# Kitty/undercurl + hızlı ESC (vim & vi-mode için kritik)
set -sg escape-time 10
set -g focus-events on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi
set -g status-position top
set -g allow-passthrough on

# Pencere ismi = çalıştığın dizin
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'


#################
### KEYBINDS ###
#################

# Config reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Split — cwd korunur (kitty'deki mantıkla aynı)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane gezinme (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix'siz pane gezinme (Alt + ok)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Pane resize (prefix basılı tut, HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window gezinme
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

bind x kill-pane
bind X kill-window
bind z resize-pane -Z


####################
### COPY MODE ###
####################

bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Wayland (Arch/Hyprland) -> wl-copy, X11 (Kali/Xfce) -> xclip
if-shell '[ -n "$WAYLAND_DISPLAY" ]' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"; \
   bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"; \
   bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'


####################
### GÖRÜNÜM ###
####################

set -g pane-border-style          "fg=#45475a"
set -g pane-active-border-style   "fg=#b4befe"
set -g pane-border-lines single

set -g message-style "fg=#1e1e2e,bg=#b4befe,bold"
set -g mode-style    "fg=#1e1e2e,bg=#cba6f7,bold"

set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#1e1e2e,bg=#b4befe,bold] #S #[fg=#b4befe,bg=#1e1e2e,nobold] "
set -g status-right "#[fg=#585b70]#{?client_prefix,#[fg=#f38ba8]PREFIX ,}#[fg=#89b4fa]#h #[fg=#585b70]| #[fg=#a6e3a1]%d.%m %H:%M "

setw -g window-status-format         "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W #[default]"
setw -g window-status-separator ""
