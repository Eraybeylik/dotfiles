"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
palette = 'catppuccin_mocha'
add_newline = false

# ===== PROMPT FORMAT =====
# left: path + prompt char | right: toolchain, git, duration, clock
format = """$directory$character"""

right_format = """\
$python\
$nodejs\
$rust\
$golang\
$java\
$php\
$docker_context\
$git_branch\
$git_status\
$cmd_duration\
$time"""

# ===== COMMAND DURATION =====
[cmd_duration]
min_time = 2000
style = "dim"
format = "[$duration]($style) "

# ===== CHARACTER =====
[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](lavender)"
vimcmd_visual_symbol = "[❮](yellow)"
vimcmd_replace_symbol = "[❮](mauve)"

# ===== CLOCK =====
[time]
disabled = false
time_format = "%H:%M"
style = "dim"
format = "[$time]($style)"

# ===== DIRECTORY =====
[directory]
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true
style = "bold lavender"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"~" = "~"

# ===== GIT =====
[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "🏳 "
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ===== PROGRAMMING LANGUAGES =====
[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[rust]
symbol = "󱘗 "
style = "bold red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

[php]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "

# ===== DOCKER =====
[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true

# ===== CATPPUCCIN MOCHA PALETTE =====
