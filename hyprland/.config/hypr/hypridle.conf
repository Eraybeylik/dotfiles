general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off 30s after lock
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Deep idle: hibernate directly.
# NOT suspend-then-hibernate: this hardware (RTX 4070 laptop) doesn't support
# s2idle/S3 suspend at all (see Arch Linux Hibernate.md) - the suspend phase
# left the NVIDIA GPU in a corrupted state (NVRM "Invalid state" / TLB
# invalidation failures) that survived resume as an unrecoverable black
# screen. Plain hibernate is the same tested path lid-close already uses.
listener {
    timeout = 1800
    on-timeout = systemctl hibernate
}
