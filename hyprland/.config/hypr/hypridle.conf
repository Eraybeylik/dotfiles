general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off 30s after lock
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 15 min idle, but only when running on battery (BAT1 discharging).
# On AC the machine stays up (ssh, downloads, local models).
listener {
    timeout = 900
    on-timeout = grep -qx Discharging /sys/class/power_supply/BAT1/status && systemctl suspend
}
